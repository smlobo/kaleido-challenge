[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
]
solc_version = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Warnings inside OpenZeppelin and forge-std are not ours to fix.
ignored_warnings_from = ["node_modules"]
# 4591: solc's "more than 256 warnings" note, all of them from forge-std.
ignored_error_codes = ["license", "code-size", "init-code-size", "transient-storage", 4591]
