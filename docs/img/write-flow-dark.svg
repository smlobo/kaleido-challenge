<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 808" width="1000" height="808" role="img" aria-label="The life of a write: dry run, save, send (or the submitter loop), 202, then the receipt loop"><title>The life of a write: dry run, save, send (or the submitter loop), 202, then the receipt loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs><rect width="100%" height="100%" fill="#0d1117"/><rect x="10" y="122" width="980" height="58" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="84" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">1  dry run</text><text x="84" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">no lock held</text><rect x="10" y="192" width="980" height="112" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="84" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">2  save</text><text x="84" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">one Postgres transaction</text><rect x="10" y="316" width="980" height="112" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="84" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">3  send (fast path)</text><text x="84" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">a second transaction</text><rect x="10" y="466" width="980" height="112" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="6 4"/><text x="84" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">didn't send</text><text x="84" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">3b  submitter loop, 1 s</text><text x="84" y="502" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">only if the fast path</text><rect x="10" y="590" width="980" height="90" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="84" y="610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">4  receipt loop, every 1 s</text><text x="84" y="626" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">background goroutine</text><rect x="10" y="690" width="980" height="104" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="84" y="710" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">5  read the result</text><text x="84" y="726" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">from Postgres only</text><rect x="10" y="20" width="120" height="40" rx="8" fill="#1f242b" stroke="#9198a1" stroke-width="1.5"/><text x="70.0" y="45.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Client</text><line x1="70" y1="60" x2="70" y2="788" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="220" y="20" width="120" height="40" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="280.0" y="45.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">ticketing</text><line x1="280" y1="60" x2="280" y2="788" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="580" y="20" width="120" height="40" rx="8" fill="#0f3320" stroke="#3fb950" stroke-width="1.5"/><text x="640.0" y="45.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Postgres</text><line x1="640" y1="60" x2="640" y2="788" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="840" y="20" width="120" height="40" rx="8" fill="#2e1a52" stroke="#ab7df8" stroke-width="1.5"/><text x="900.0" y="45.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Besu</text><line x1="900" y1="60" x2="900" y2="788" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M70,100 L276,100" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="175.0" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">POST, with Idempotency-Key</text><path d="M280,162 L896,162" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="590.0" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">eth_estimateGas: would it revert? then refuse now (4xx)</text><path d="M280,232 L636,232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">BEGIN · lock the event or ticket row</text><path d="M280,262 L636,262" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">take the next nonce (signing_keys row) · sign in Go</text><path d="M280,292 L636,292" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">INSERT transactions (signed) · COMMIT</text><path d="M280,356 L636,356" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="349" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">BEGIN · claim the row FOR UPDATE SKIP LOCKED</text><path d="M280,386 L896,386" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="590.0" y="379" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">eth_sendRawTransaction</text><path d="M280,416 L636,416" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">mark submitted · COMMIT</text><path d="M280,448 L74,448" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="175.0" y="441" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">202 · operation ID</text><path d="M280,500 L636,500" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">claim signed rows, or submitted with no receipt for 10 s</text><path d="M280,530 L896,530" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="590.0" y="523" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">eth_sendRawTransaction: oldest nonce first, per key</text><path d="M280,560 L636,560" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="553" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">mark submitted · COMMIT</text><path d="M280,630 L896,630" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="590.0" y="623" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">eth_getTransactionReceipt</text><path d="M280,664 L636,664" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="657" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">mined or reverted · update the ticket or event</text><path d="M70,748 L276,748" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="175.0" y="741" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">GET /operations/{id}</text><path d="M280,766 L636,766" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/><text x="460.0" y="759" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">SELECT (no chain call)</text><path d="M280,784 L74,784" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="175.0" y="777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">status, block number</text></svg>
