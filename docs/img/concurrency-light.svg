<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="Concurrency map: goroutines in one instance and the Postgres locks they share"><title>Concurrency map: goroutines in one instance and the Postgres locks they share</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="580" height="600" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="34" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">one ticketing instance</text><text x="34" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">a single process</text><rect x="40" y="76" width="540" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="52" y="102.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">main goroutine</text><text x="52" y="119.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">startup (serial) → wait for SIGTERM or an HTTP error → shutdown</text><rect x="40" y="168" width="260" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="52" y="190.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">HTTP server</text><text x="52" y="207.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">go a.srv.Serve(ln)</text><rect x="52" y="258" width="248" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><rect x="46" y="252" width="248" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><rect x="40" y="246" width="248" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="52" y="275.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">request goroutines</text><text x="52" y="292.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">one per request:</text><text x="52" y="309.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">auth, checks, dry run,</text><text x="52" y="326.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">save transaction, fast-path send</text><path d="M170,134 L170,166" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><path d="M170,218 L170,244" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="320" y="168" width="260" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="332" y="190.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">outbox.Run</text><text x="332" y="207.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">go … · own context</text><rect x="320" y="246" width="260" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="332" y="267.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">submitter loop (every 1 s)</text><text x="332" y="284.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">send signed rows,</text><text x="332" y="301.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">resend overdue ones</text><rect x="320" y="322" width="260" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="332" y="343.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">receipt loop (every 1 s)</text><text x="332" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">record receipts,</text><text x="332" y="377.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">run the final-status hook</text><path d="M450,134 L450,166" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><path d="M450,218 L450,244" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><path d="M580,193 L594,193 L594,354 L582,354" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="410" width="540" height="56" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5" stroke-dasharray="6 4"/><text x="52" y="435.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">library goroutines</text><text x="52" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">OTel batch span exporter · pgxpool health check · signal watcher</text><text x="40" y="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">shared, safe for concurrent use</text><rect x="40" y="512" width="260" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="52" y="533.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">pgxpool</text><text x="52" y="550.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">one connection per</text><text x="52" y="567.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">open transaction</text><rect x="320" y="512" width="260" height="64" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="332" y="533.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">chain RPC client</text><text x="332" y="550.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">10 s timeout per call</text><text x="332" y="567.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">while a row is locked</text><rect x="640" y="20" width="340" height="362" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="654" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Postgres</text><text x="654" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">where the synchronisation lives</text><rect x="656" y="76" width="308" height="81" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="668" y="97.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">row locks</text><text x="668" y="114.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">signing_keys: nonces</text><text x="668" y="131.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">events: ticket numbers</text><text x="668" y="148.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">tickets: resale, check-in</text><rect x="656" y="169" width="308" height="47" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="668" y="189.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">work queue</text><text x="668" y="206.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">transactions … FOR UPDATE SKIP LOCKED</text><rect x="656" y="228" width="308" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="668" y="249.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">unique constraints</text><text x="668" y="266.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">idempotency key, (from, nonce),</text><text x="668" y="283.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">one deployer key</text><rect x="656" y="304" width="308" height="47" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="668" y="324.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">advisory lock</text><text x="668" y="341.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">migrations, one instance at a time</text><path d="M300,530 L310,530 L310,484 L618,484 L618,230 L638,230" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="420" width="340" height="58" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4"/><text x="652" y="446.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">other ticketing instances</text><text x="652" y="463.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">the same goroutines, the same Postgres</text><path d="M810,420 L810,384" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="640" y="548" width="340" height="62" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="652" y="576.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Besu</text><text x="652" y="593.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">orders each key's transactions by nonce</text><path d="M580,560 L638,560" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="636" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="40" y="647" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Go: the service's goroutines</text><rect x="232.79999999999998" y="636" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="252.79999999999998" y="647" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Postgres</text><rect x="313.59999999999997" y="636" width="14" height="14" rx="3" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="333.59999999999997" y="647" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">chain</text><rect x="374.59999999999997" y="636" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#59636e" stroke-width="1.5"/><text x="394.59999999999997" y="647" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">started by a library</text></svg>
