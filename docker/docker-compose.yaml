# Local stack: single-node Besu QBFT chain + Postgres + the ticketing service
#
# docker compose up -d --build --wait # start all; API on http://localhost:8080,
#                                     # traces on http://localhost:16686 (Jaeger)
# docker compose up -d --wait besu postgres # chain and database only, for go run
#                             # JSON-RPC on http://localhost:8545, ws://localhost:8546
# docker compose down # stop and wipe chain state
#
# Chain ID 1337, 2s blocks, forks through Prague, zero gas price.
# Tracing: the service and Besu send OpenTelemetry spans to Jaeger. A request's
# trace runs from the API call through its JSON-RPC calls (into Besu's own
# spans) and SQL, to the outbox's send, receipt and final-status hook.
# Prefunded (1,000,000 ETH each): the 10 standard Hardhat/Anvil dev accounts,
# mnemonic "test test test test test test test test test test test junk".

services:
  # Trace store and UI. Takes OTLP over gRPC (4317, from Besu) and HTTP (4318,
  # from the service). Traces are kept in memory and go with the container.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - 16686:16686 # UI
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP, for a service started with go run

  besu:
    image: hyperledger/besu:26.11.0
    ports:
      - 8545:8545 # HTTP JSON-RPC
      - 8546:8546 # WebSocket JSON-RPC
    # Besu's built-in OpenTelemetry tracing: a span per JSON-RPC request and
    # one per method inside it. It joins the caller's trace from a b3 header.
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: besu
      # Record only calls that arrive inside a trace; the health check and
      # other untraced calls would otherwise each start a trace of their own.
      OTEL_TRACES_SAMPLER: parentbased_always_off
      # Traces only: with --metrics-protocol=opentelemetry Besu would also push
      # metrics over OTLP, which Jaeger does not accept (UNIMPLEMENTED).
      OTEL_METRICS_EXPORTER: none
    depends_on:
      jaeger:
        condition: service_started
    configs:
      - source: genesis
        target: /config/genesis.json
      - source: validator_key
        target: /config/validator.key
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/validator.key
      - --data-path=/tmp/besu
      - --min-gas-price=0
      - --target-gas-limit=30000000
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL
      - --host-allowlist=*
      - --tx-pool=SEQUENCED
      - --tx-pool-limit-by-account-percentage=1.0
      - --tx-pool-max-size=1000000
      - --revert-reason-enabled
      - --discovery-enabled=false
      - --metrics-enabled
      - --metrics-protocol=opentelemetry
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Service state store. No volume on purpose: `down` wipes it together with
  # the chain, so keys and nonces never outlive the chain they belong to.
  postgres:
    image: postgres:17.6-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 5s
      retries: 20

  # The ticketing service, built from the Dockerfile at the repository root.
  # It needs KEY_ENCRYPTION_KEY from your shell (openssl rand -base64 32), and
  # takes ADMIN_TOKEN from it too if set. Only the chain and the database:
  #   docker compose up -d --wait besu postgres
  ticketing:
    build:
      context: ..
    image: kaleido-ticketing
    ports:
      - 8080:8080
    environment:
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DATABASE_URL: postgres://ticketing:ticketing@postgres:5432/ticketing?sslmode=disable
      ETH_RPC_URL: http://besu:8545
      PUBLIC_BASE_URL: http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ticketing
    depends_on:
      besu:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure:3

configs:
  # Validator node key; its address (0x950bffd0f9ed35b37879c186ae770d2c94f08147)
  # is encoded in genesis extraData — it is not recommended to change these.
  # If you change the validator key, you must regenerate extraData and fork or wipe your chain.
  validator_key:
    content:
      "0x77fe91741236e10635bf78fbf2a24433967381034e964578934d8f6f7e8ac658"
  genesis:
